<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Складская зарплата | Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>📦 Калькулятор зарплаты склада</h1>
      <p class="subhead">Секции, тарифы + оклад 45 000 ₽</p>
    </header>

    <main>
      <!-- Блок с фиксированным окладом -->
      <div class="salary-base-card">
        <div class="base-info">
          <span class="label">💰 Базовый оклад (смена)</span>
          <span class="base-amount" id="baseSalaryDisplay">45 000 ₽</span>
        </div>
        <div class="hint">Оклад прибавляется автоматически</div>
      </div>

      <!-- Секции 1..9 будут вставлены сюда динамически -->
      <div class="sections-grid" id="sectionsContainer"></div>

      <!-- Блок тары (доплата за тару) -->
      <div class="container-card" id="containerCard">
        <div class="container-header">
          <label class="checkbox-label">
            <input type="checkbox" id="containerCheckbox"> 
            <span>📦 Отметить тару за смену</span>
          </label>
          <span class="helper-text">Если нет тары — не ставьте галочку</span>
        </div>
        
        <div id="containerControls" class="container-controls hidden">
          <div class="input-group">
            <label for="containerQty">Количество тары (шт)</label>
            <input type="number" id="containerQty" value="0" min="0" step="1" class="number-input">
          </div>
          <div class="input-group">
            <label for="containerTariff">Тариф за 1 тару (₽)</label>
            <input type="number" id="containerTariff" value="0.30" step="0.01" min="0" class="tariff-input">
          </div>
          <div class="container-subtotal" id="containerSubtotalDisplay">➕ Тара: 0 ₽</div>
        </div>
      </div>

      <!-- ИТОГО: оклад + секции + тара -->
      <div class="total-card">
        <div class="total-row">
          <span class="total-label">ИТОГО ЗАРПЛАТА (оклад + сдельная часть + тара)</span>
          <span class="total-amount" id="grandTotal">0 ₽</span>
        </div>
        <button type="button" id="resetQuantities" class="reset-btn">🔄 Сбросить количество товара</button>
      </div>
    </main>
    <footer>
      <p>⚡ Редактируйте тарифы в каждой секции — сумма пересчитается мгновенно</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
